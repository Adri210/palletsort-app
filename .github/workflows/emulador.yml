name: Teste no emulador Android

on:
  push:
    paths:
      - "apk_bundle/**"
      - ".github/workflows/emulador.yml"
  workflow_dispatch:

jobs:
  emulador:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.7"

      - name: Extrair o código do app
        run: |
          mkdir -p src
          cat apk_bundle/palletsort_apk.tar.gz.part* | tar -xz -C src
          cd src/app && flutter pub get

      - name: Rodar o teste de desempenho no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disable-animations: true
          working-directory: src/app
          script: flutter test integration_test/benchmark_test.dart -d emulator-5554 --dart-define=PALLETSORT_API_URL=https://palletsort.onrender.com || (adb logcat -d | grep -iE "flutter|tflite|litert|fatal|androidruntime|lowmemory|oom|killing" | tail -250; exit 1)
